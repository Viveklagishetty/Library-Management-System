<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Portal - Library Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Member Dashboard</h1>
        <div id="user-info">Welcome, <span id="member-name">Member</span></div>
    </header>

    <main class="dashboard-container">
        <!-- Search Section -->
        <section class="card">
            <h2>Book Search & Catalog</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search by title, author, or ISBN...">
                <button onclick="searchBooks()">Search</button>
            </div>
            <table id="catalog-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="catalog-list"></tbody>
            </table>
        </section>

        <!-- Borrowing History -->
        <section class="card">
            <h2>My Borrowed Books</h2>
            <table id="loans-table">
                <thead>
                    <tr>
                        <th>Book Title</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="loans-list"></tbody>
            </table>
        </section>

        <!-- Fine Tracking -->
        <section class="card">
            <h2>Fines & Balance</h2>
            <div id="fine-summary">
                <p>Outstanding Fine: <strong id="total-fine">$0.00</strong></p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/member_dashboard.js') }}"></script>
</body>
</html>
