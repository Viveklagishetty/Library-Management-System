<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books Management</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container mt-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="fa-solid fa-book"></i>
                Books Management
            </h2>

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#bookModal"
                onclick="clearForm()">

                <i class="fa-solid fa-plus"></i>
                Add Book
            </button>
        </div>

        <!-- Search -->
        <div class="row mb-3">

            <div class="col-md-8">
                <input
                    type="text"
                    id="searchBook"
                    class="form-control"
                    placeholder="Search by title, author or ISBN">
            </div>

            <div class="col-md-2">
                <button
                    type="button"
                    id="searchBtn"
                    class="btn btn-success w-100">

                    <i class="fa fa-search"></i>
                    Search
                </button>
            </div>

            <div class="col-md-2">
                <button
                    type="button"
                    id="refreshBtn"
                    class="btn btn-secondary w-100">

                    <i class="fa fa-refresh"></i>
                    Refresh
                </button>
            </div>

        </div>

        <!-- Books Table -->
        <div class="card shadow">
            <div class="card-body">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Genre</th>
                            <th>ISBN</th>
                            <th>Total</th>
                            <th>Available</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="booksTableBody">
                        <tr>
                            <td colspan="8" class="text-center">
                                Loading books...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </div>

    </div>

    <!-- BOOK MODAL -->
    <div
        class="modal fade"
        id="bookModal"
        tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalTitle">

                        Add Book
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <!-- Modal Body -->
                <div class="modal-body">

                    <input
                        type="hidden"
                        id="bookId">

                    <div class="mb-3">
                        <label class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Author
                        </label>

                        <input
                            type="text"
                            id="author"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Genre
                        </label>

                        <input
                            type="text"
                            id="genre"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            ISBN
                        </label>

                        <input
                            type="text"
                            id="isbn"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Total Copies
                        </label>

                        <input
                            type="number"
                            id="copies"
                            class="form-control">
                    </div>

                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close
                    </button>

                    <button
                        type="button"
                        id="saveBookBtn"
                        class="btn btn-primary">

                        Save
                    </button>

                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Books JS -->
    <script src="{{ url_for('static', filename='js/books.js') }}"></script>

</body>

</html>
